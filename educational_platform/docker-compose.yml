version: "3.8"

# ====================================================
# پلتفرم آموزشی محلی — مشابه شاد
# Local Educational Platform (SHAD-like)
# بهینه‌سازی‌شده برای ۱۰۰ کاربر همزمان
# Optimized for 100 concurrent users
# ====================================================

services:

  # --------------------------------------------------
  # MongoDB — پایگاه داده اصلی
  # --------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: edu_mongodb
    restart: unless-stopped
    command: >
      mongod
      --replSet ${MONGO_REPLICA_SET_NAME:-rs0}
      --oplogSize 128
      --bind_ip_all
      --wiredTigerCacheSizeGB 1
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongoadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-ChangeMongoPassword456!}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-rocketchat}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./config/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - edu_internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # --------------------------------------------------
  # MongoDB Init — راه‌اندازی Replica Set
  # --------------------------------------------------
  mongo-init:
    image: mongo:6.0
    container_name: edu_mongo_init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      mongosh
        --host mongodb
        --username ${MONGO_INITDB_ROOT_USERNAME:-mongoadmin}
        --password ${MONGO_INITDB_ROOT_PASSWORD:-ChangeMongoPassword456!}
        --authenticationDatabase admin
        --eval "
          try {
            rs.status();
            print('Replica set already initialized');
          } catch(e) {
            rs.initiate({
              _id: '${MONGO_REPLICA_SET_NAME:-rs0}',
              members: [{ _id: 0, host: 'mongodb:27017' }]
            });
            print('Replica set initialized');
          }
        "
    networks:
      - edu_internal

  # --------------------------------------------------
  # MinIO — ذخیره‌سازی فایل‌ها (تصاویر، ویدیو، اسناد)
  # --------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: edu_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ChangeMinioPassword789!}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"   # MinIO Console (فقط برای ادمین)
    networks:
      - edu_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # --------------------------------------------------
  # MinIO Setup — ایجاد Bucket اولیه
  # --------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: edu_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-ChangeMinioPassword789!};
        mc mb --ignore-existing local/${MINIO_BUCKET:-rocketchat};
        mc anonymous set download local/${MINIO_BUCKET:-rocketchat};
        echo 'MinIO bucket created';
      "
    networks:
      - edu_internal

  # --------------------------------------------------
  # Rocket.Chat — سرور اصلی پیام‌رسان
  # --------------------------------------------------
  rocketchat:
    image: rocket.chat:6.12.0
    container_name: edu_rocketchat
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      # اتصال به MongoDB با Replica Set
      MONGO_URL: >-
        mongodb://${MONGO_INITDB_ROOT_USERNAME:-mongoadmin}:${MONGO_INITDB_ROOT_PASSWORD:-ChangeMongoPassword456!}@mongodb:27017/${MONGO_DB:-rocketchat}?authSource=admin&replicaSet=${MONGO_REPLICA_SET_NAME:-rs0}
      MONGO_OPLOG_URL: >-
        mongodb://${MONGO_INITDB_ROOT_USERNAME:-mongoadmin}:${MONGO_INITDB_ROOT_PASSWORD:-ChangeMongoPassword456!}@mongodb:27017/local?authSource=admin&replicaSet=${MONGO_REPLICA_SET_NAME:-rs0}
      ROOT_URL: ${ROOT_URL:-http://localhost:3000}
      PORT: "3000"
      DEPLOY_PLATFORM: selfhosted
      # تنظیمات اولیه ادمین
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASS: ${ADMIN_PASSWORD:-ChangeThisPassword123!}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@school.local}
      # بهینه‌سازی برای 100 کاربر
      NODE_OPTIONS: "--max-old-space-size=${NODE_MAX_MEMORY:-2048}"
      # تنظیم ذخیره‌سازی MinIO
      OVERWRITE_SETTING_FileUpload_Storage_Type: "AmazonS3"
      OVERWRITE_SETTING_FileUpload_S3_Bucket: ${MINIO_BUCKET:-rocketchat}
      OVERWRITE_SETTING_FileUpload_S3_Endpoint: "http://minio:9000"
      OVERWRITE_SETTING_FileUpload_S3_AWSAccessKeyId: ${MINIO_ROOT_USER:-minioadmin}
      OVERWRITE_SETTING_FileUpload_S3_AWSSecretAccessKey: ${MINIO_ROOT_PASSWORD:-ChangeMinioPassword789!}
      OVERWRITE_SETTING_FileUpload_S3_ForcePathStyle: "true"
      OVERWRITE_SETTING_FileUpload_S3_Region: "us-east-1"
      # غیرفعال‌سازی ثبت‌نام عمومی (برای محیط آموزشی)
      OVERWRITE_SETTING_Accounts_RegistrationForm: "Disabled"
      # فعال‌سازی ویدیو کنفرانس Jitsi
      OVERWRITE_SETTING_Jitsi_Enabled: ${JITSI_ENABLED:-true}
      OVERWRITE_SETTING_Jitsi_Domain: ${JITSI_DOMAIN:-meet.jit.si}
    ports:
      - "${ROCKETCHAT_PORT:-3000}:3000"
    networks:
      - edu_internal
      - edu_external
    volumes:
      - rocketchat_uploads:/app/uploads
    healthcheck:
      test: >
        ["CMD", "curl", "-f", "http://localhost:3000/api/info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: "${NODE_MAX_MEMORY:-2048}m"

  # --------------------------------------------------
  # Nginx — Reverse Proxy + SSL
  # --------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: edu_nginx
    restart: unless-stopped
    depends_on:
      rocketchat:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - edu_internal
      - edu_external
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

# --------------------------------------------------
# Networks
# --------------------------------------------------
networks:
  edu_internal:
    driver: bridge
    # internal: true prevents direct internet access for MongoDB and MinIO;
    # Rocket.Chat and Nginx are also on edu_external to reach clients.
    # Image pulls happen via `docker compose pull` before `docker compose up`.
    internal: true   # بدون دسترسی مستقیم به اینترنت
  edu_external:
    driver: bridge

# --------------------------------------------------
# Volumes
# --------------------------------------------------
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  minio_data:
    driver: local
  rocketchat_uploads:
    driver: local
  nginx_logs:
    driver: local
